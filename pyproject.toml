[project]
name = "propvalue-ai"
version = "1.0.0"
description = "AI Property Valuation and Real Estate RAG Engine"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.2.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "joblib>=1.2.0",
    "requests>=2.31.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6"
]

[tool.vercel]
entrypoint = "api.index:app"
